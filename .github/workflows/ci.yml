name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbuddy
          POSTGRES_PASSWORD: gymbuddy
          POSTGRES_DB: gymbuddy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gymbuddy" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gymbuddy:gymbuddy@localhost:5432/gymbuddy_test
      SESSION_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Versions agree
        # The version lives in four files that cannot agree on their own, and Android refuses
        # an update whose versionCode did not rise. Cheaper to catch here than after upload.
        run: node infra/scripts/version.mjs --check
      - name: Locale packs are in sync
        # A key present in some locales and missing from others falls back to English
        # mid-sentence, silently, with nothing failing anywhere.
        run: node apps/client/scripts/check-locales.mjs
      - name: Domain tests
        run: npm run test -w @gymbuddy/domain
      - name: AI layer tests
        run: npm run test -w @gymbuddy/ai
      - name: Database tests
        run: npm run test -w @gymbuddy/db
      - name: API tests
        run: npm run test -w @gymbuddy/api
      - name: Client tests
        run: npm run test -w @gymbuddy/client
      - name: Release tooling tests
        run: npm run test:release
      - name: Mobile build talks to nobody
        # The native build's store listing declares that it collects and transmits nothing.
        # This is the check behind that claim: build the mobile bundle and fail if a host
        # nobody has accounted for appears in it. See docs/store/privacy.md.
        # `build:mobile:web` rather than a bare vite build: it carries the same CDN media
        # bases the shipped bundle has, and without them jsDelivr never appears and the check
        # passes on an artifact nobody ships. `build:mobile` itself also runs `cap sync`,
        # which would need the native toolchains for a check that only reads the web bundle.
        run: |
          npm run build:mobile:web -w @gymbuddy/client
          node infra/scripts/check-mobile-hosts.mjs
      - name: Web build
        run: npm run build -w @gymbuddy/client
      - name: End-to-end smoke test
        run: |
          node packages/db/src/cli.js reset
          npm start -w @gymbuddy/api &
          npx wait-on -t 30000 http://127.0.0.1:3000/api/health
          ./infra/scripts/smoke.sh http://127.0.0.1:3000
      - name: Browser end-to-end test
        run: |
          npx playwright install --with-deps chromium
          node packages/db/src/cli.js reset
          SEED_DEMO=1 node packages/db/src/cli.js demo
          npm start -w @gymbuddy/api &
          npm run dev -w @gymbuddy/client -- --port 5173 --host 127.0.0.1 &
          npx wait-on -t 60000 http://127.0.0.1:5173/api/health
          node infra/scripts/e2e.mjs http://127.0.0.1:5173

      - name: Icons match the vectors in logo/
        # Runs here because the step above already installed the Chromium this renders with.
        # The app icon exists in twenty-odd files across three platforms; the only way they
        # stay one identity is for all of them to be output.
        run: node infra/scripts/render-logo.mjs --check

      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q
