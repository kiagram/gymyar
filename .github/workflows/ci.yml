name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbuddy
          POSTGRES_PASSWORD: gymbuddy
          POSTGRES_DB: gymbuddy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gymbuddy" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gymbuddy:gymbuddy@localhost:5432/gymbuddy_test
      SESSION_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Domain tests
        run: npm run test -w @gymbuddy/domain
      - name: Database tests
        run: npm run test -w @gymbuddy/db
      - name: API tests
        run: npm run test -w @gymbuddy/api
      - name: Client tests
        run: npm run test -w @gymbuddy/client
      - name: Web build
        run: npm run build -w @gymbuddy/client
      - name: End-to-end smoke test
        run: |
          node packages/db/src/cli.js reset
          npm start -w @gymbuddy/api &
          npx wait-on -t 30000 http://127.0.0.1:3000/api/health
          ./infra/scripts/smoke.sh http://127.0.0.1:3000
      - name: Browser end-to-end test
        run: |
          npx playwright install --with-deps chromium
          node packages/db/src/cli.js reset
          SEED_DEMO=1 node packages/db/src/cli.js demo
          npm start -w @gymbuddy/api &
          npm run dev -w @gymbuddy/client -- --port 5173 --host 127.0.0.1 &
          npx wait-on -t 60000 http://127.0.0.1:5173/api/health
          node infra/scripts/e2e.mjs http://127.0.0.1:5173

      - name: Compose file is valid
        run: cp .env.example .env && docker compose config -q
