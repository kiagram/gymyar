name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymyar
          POSTGRES_PASSWORD: gymyar
          POSTGRES_DB: gymyar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gymyar" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://gymyar:gymyar@localhost:5432/gymyar_test
      SESSION_SECRET: ci-secret-not-for-production
      STORAGE_S3_TEST_ENDPOINT: http://localhost:9000
      STORAGE_S3_ACCESS_KEY_ID: gymyar
      STORAGE_S3_SECRET_ACCESS_KEY: gymyar-secret
    steps:
      # v5 is the first major of either that runs on node24. v4 was being force-run on it
      # already, with a deprecation warning on every run — a warning today and a step that
      # stops starting whenever the runners drop the shim. `node-version` below is the Node
      # the project's own steps get and is unrelated to the runtime the action itself uses.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Versions agree
        # The version lives in four files that cannot agree on their own, and Android refuses
        # an update whose versionCode did not rise. Cheaper to catch here than after upload.
        run: node infra/scripts/version.mjs --check
      - name: Locale packs are in sync
        # A key present in some locales and missing from others falls back to English
        # mid-sentence, silently, with nothing failing anywhere.
        run: node apps/client/scripts/check-locales.mjs
      - name: Domain tests
        run: npm run test -w @gymyar/domain
      - name: AI layer tests
        run: npm run test -w @gymyar/ai
      - name: MinIO, for the S3 storage driver
        # `docker run` rather than a `services:` entry, for two reasons that both had to be
        # found the hard way. A service container cannot pass a command, and `minio/minio`
        # needs `server /data` — which is why the first attempt reached for `bitnami/minio`,
        # whose image starts a server on its own. That image then failed to pull at all:
        # Bitnami moved their free catalogue to `bitnamilegacy/` and put `bitnami/` behind a
        # subscription, so the job died in "Initialize containers" before a step ran.
        #
        # The official image with an explicit command has neither problem, and the readiness
        # loop uses the runner's curl rather than anything inside the container.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=gymyar -e MINIO_ROOT_PASSWORD=gymyar-secret \
            minio/minio:latest server /data
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO never became ready"; docker logs minio; exit 1

      - name: Storage tests
        # The S3 driver's tests skip themselves without STORAGE_S3_TEST_ENDPOINT, so they run
        # locally for anybody without a MinIO. Skipping here would mean the only place the
        # driver is ever exercised is a laptop that happens to have one up.
        run: npm run test -w @gymyar/storage
      - name: Database tests
        run: npm run test -w @gymyar/db
      - name: API tests
        run: npm run test -w @gymyar/api
      - name: Client tests
        run: npm run test -w @gymyar/client
      - name: Release tooling tests
        run: npm run test:release
      - name: Mobile build talks to nobody
        # The native build's store listing declares that it collects and transmits nothing.
        # This is the check behind that claim: build the mobile bundle and fail if a host
        # nobody has accounted for appears in it. See docs/store/privacy.md.
        # `build:mobile:web` rather than a bare vite build: it carries the same CDN media
        # bases the shipped bundle has, and without them jsDelivr never appears and the check
        # passes on an artifact nobody ships. `build:mobile` itself also runs `cap sync`,
        # which would need the native toolchains for a check that only reads the web bundle.
        run: |
          npm run build:mobile:web -w @gymyar/client
          node infra/scripts/check-mobile-hosts.mjs
      - name: Web build
        run: npm run build -w @gymyar/client
      - name: End-to-end smoke test
        # `STORAGE_PATH` because this step runs the API under Node rather than in its image,
        # and the default is `/data/media` — a path the container owns and the runner cannot
        # create. Without it the first form-check upload is a 500 from `mkdir /data`, which is
        # what this step has actually been failing on rather than on anything it tests.
        #
        # `ci_start` rather than `&` so the API does not outlive this step. See the header of
        # infra/scripts/ci-server.sh: it did, and the browser step below ran against it.
        env:
          STORAGE_PATH: ${{ runner.temp }}/media
        run: |
          source infra/scripts/ci-server.sh
          node packages/db/src/cli.js reset
          ci_start 3000 npm start -w @gymyar/api
          npx wait-on -t 30000 http://127.0.0.1:3000/api/health
          ./infra/scripts/smoke.sh http://127.0.0.1:3000
      - name: Browser end-to-end test
        # Same reason, and a directory of its own so a failure here is not reading the last
        # step's bytes — which is exactly what it was doing while the step above leaked its
        # API onto :3000 and this one's died on EADDRINUSE without failing anything.
        #
        # Both URLs, because waiting only on :5173 asks Vite's proxy whether *something*
        # answers `/api/health`. That is the question that used to be answered by the previous
        # step's server. Naming :3000 too makes an API that did not start read as an API that
        # did not start.
        env:
          STORAGE_PATH: ${{ runner.temp }}/media-e2e
        run: |
          source infra/scripts/ci-server.sh
          # `playwright-core`'s own CLI, not `npx playwright`. Only `playwright-core` is a
          # dependency here, so `npx playwright` is not a local binary — npm fetches whatever
          # `playwright` is latest on the registry and installs *its* browser revisions, which
          # stop matching the pinned `playwright-core` the moment upstream publishes. That is
          # what broke this step with nothing in this repository having changed: it downloaded
          # one Chromium and `e2e.mjs` went looking for another. This CLI ships inside the
          # version the lockfile pins, so the two cannot disagree.
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node packages/db/src/cli.js reset
          SEED_DEMO=1 node packages/db/src/cli.js demo
          ci_start 3000 npm start -w @gymyar/api
          ci_start 5173 npm run dev -w @gymyar/client -- --port 5173 --host 127.0.0.1
          npx wait-on -t 60000 http://127.0.0.1:3000/api/health http://127.0.0.1:5173/api/health
          node infra/scripts/e2e.mjs http://127.0.0.1:5173

      - name: Icons match the vectors in logo/
        # Runs here because the step above already installed the Chromium this renders with.
        # The app icon exists in twenty-odd files across three platforms; the only way they
        # stay one identity is for all of them to be output.
        run: node infra/scripts/render-logo.mjs --check

      - name: The compose stack actually runs
        # Every other step in this file runs the API under Node directly, with no nginx in
        # front. This is the only one that builds the two images a self-hoster builds and puts
        # the real reverse proxy in front of them — which is the only place the X-Accel-Redirect
        # media path, the workspace copies in both Dockerfiles and the location precedence in
        # nginx.conf exist at all. All four of those were broken at once, and every test above
        # this line passed the whole time.
        run: |
          cp .env.example .env
          # Production refuses a blank one, and the image sets NODE_ENV=production.
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> .env
          docker compose config -q
          # Short-circuit the 140 MB exercise-media clone: the media service skips the download
          # when ./media/img is non-empty. This used to touch a single `.ci-placeholder` there,
          # because nothing below looked at the exercise library. `smoke.sh` does now — it takes
          # an exercise from /api/exercises and follows both of its URLs, which is the check that
          # was missing while 1,324 stored links 404'd on every hosted instance. A directory with
          # one arbitrarily-named file in it fails that, so the placeholders carry the dataset's
          # own filenames. See the script for what this proves and what it does not.
          node infra/scripts/media-placeholders.mjs
          docker compose up -d --build
          npx wait-on -t 300000 http://127.0.0.1:8080/api/health
          ./infra/scripts/smoke.sh http://127.0.0.1:8080

      # `.env` is written by the step above and is gitignored, so on any run that failed before
      # that step it does not exist — and `docker compose` treats a missing env file as an error
      # rather than as nothing to do. Both of these then fail on top of the real failure, and the
      # run ends with three red steps of which only the first one happened. The guard is what
      # keeps a diagnostic step from becoming a second diagnosis.
      - name: Compose stack logs
        if: failure()
        run: |
          if [ ! -f .env ]; then
            echo "The compose stack was never built — this run failed before that step."
            exit 0
          fi
          docker compose logs --no-color --tail 200

      - name: Tear the stack down
        if: always()
        run: |
          if [ ! -f .env ]; then exit 0; fi
          docker compose down -v --remove-orphans
