name: gymbuddy

# One command: `docker compose up -d --build`, then http://localhost:8080
#
# On a fresh volume the api container migrates the schema, seeds the 1,324-exercise library and
# — when SEED_DEMO is set — creates a coach with three clients so there is something to click.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymbuddy}
      POSTGRES_DB: ${POSTGRES_DB:-gymbuddy}
    volumes:
      - db:/var/lib/postgresql/data     # every account, every set ever logged — BACK THIS UP
    healthcheck:
      # The api waits on this. Without it the first boot races the database's own
      # initialisation and dies on connection refused before Postgres is listening.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymbuddy} -d ${POSTGRES_DB:-gymbuddy}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset.
  #
  # The media is © Gym visual and licensed separately from this code — see NOTICE.md. Fine for
  # a local instance; a commercial deployment needs its own licence or its own assets.
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000                       # internal only — nginx proxies here
      DATABASE_URL: postgres://${POSTGRES_USER:-gymbuddy}:${POSTGRES_PASSWORD:-gymbuddy}@db:5432/${POSTGRES_DB:-gymbuddy}
      SEED_DEMO: ${SEED_DEMO:-}
      # Optional. Without it every AI feature still works, in fewer words.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STORAGE_PATH: /data/media
    volumes:
      # Uploaded media — form-check video, progress photos, voice notes.
      #
      # A named volume rather than a bind mount, so it survives `docker compose down` the way
      # `db` does. It is also the first user data that a pg_dump does not contain: the rows
      # describing these files are in Postgres and the bytes are here. Back both up, or restore
      # a database full of attachments that will not open. See docs/SELF_HOSTING.md section 7.
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  # Builds the React app and serves it, proxying /api → api and the exercise media from the
  # shared volume. One origin for everything, which passkeys require.
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

volumes:
  db:
  media:
