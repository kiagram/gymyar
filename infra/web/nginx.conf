# GymYar — one origin, three things on it.
#
#   /        the project site: what this is, who it is for, what it costs (apps/site)
#   /app/    the app itself — the React PWA (apps/client)
#   /api/    the backend
#
# One server block and one origin for all of it, which is not a tidiness preference: passkeys
# are bound to an origin, session cookies are scoped to one, and the app fetching `/api` with
# no CORS anywhere is a consequence of this file rather than of any code. A visitor lands on
# the pitch; "Open the app" is a link one level down, not a second deployment.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every redirect this server sends is relative. By default nginx builds an absolute one
    # out of `$scheme` and `$host` — and `$host` has no port in it, so `/app` on a stack
    # published at :8099 redirected to `http://127.0.0.1/app/` and landed nowhere. The same
    # applies to a real deployment behind a TLS terminator on any port but 443, and to the
    # directory redirects nginx generates on its own (`/fa` → `/fa/`). A relative `Location`
    # is resolved by the browser against the URL it actually asked for, which is the only
    # thing here that knows the truth about scheme and port.
    absolute_redirect off;

    # API → backend container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media. The API decides, nginx serves.
    #
    # The request comes here with a signature on it and is proxied to the API, which checks it
    # and answers with `X-Accel-Redirect: /_media/<key>` and no body. nginx then serves the file
    # from the shared volume below — so a 60 MB video never passes through Node, and range
    # requests (every seek in a video player is one) are handled by a web server that has been
    # doing it for twenty years rather than by a route handler.
    #
    # `proxy_buffering off` because the reply we care about is a header on an empty body; there
    # is nothing to buffer and buffering it delays the redirect for no reason.
    # `^~` is load-bearing. A storage key ends in the extension its type implies —
    # `…/<uuid>.jpg` — and the "exercise images never change → cache hard" regex location near
    # the bottom of this file matches `\.jpg$`. nginx tries regex locations *before* plain
    # prefix ones, so without `^~` every uploaded photo was matched by that block instead of
    # this one, looked for under the static root, and answered 404 — while video, whose
    # extensions are not in that list, worked. `^~` says: this prefix wins, stop before the
    # regexes. Caught by the media step in infra/scripts/smoke.sh, which is the only test that
    # runs against nginx rather than against Node serving the bytes itself.
    location ^~ /media/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Where X-Accel-Redirect lands. `internal` means nginx will only ever reach this because
    # the API sent it here — a browser asking for /_media/... directly gets a 404, which is
    # what keeps the signature check from being something a client can simply skip.
    # `^~` here for the same reason as above: the internal redirect the API sends carries the
    # same `.jpg` on the end, and an internal redirect is matched against these locations too.
    location ^~ /_media/ {
        internal;
        alias /data/media/;
        # The URL that got here expires in minutes and the bytes never change, so a private
        # cache is free. `private` and not `public`: a shared proxy must not keep one person's
        # video to hand to the next request that happens to guess the URL.
        add_header Cache-Control "private, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    # Somebody typing the address of the app rather than following a link.
    location = /app { return 301 /app/; }

    # The app. Its own SPA fallback, kept separate from the site's: a wrong path under /app/
    # is a route the client should be given a chance to render, and a wrong path anywhere else
    # is a 404. Sharing one `try_files` would mean every typo on the site quietly booting the
    # whole application instead.
    #
    # The client is built with `base: './'` and routes through a HashRouter, so nothing inside
    # it knows or cares that it is one level down — every asset is relative and every route is
    # after the `#`. That is why this move is a line in this file and not a change to the app.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # The project site. No SPA fallback — these are real files, and a missing one is missing.
    location / {
        try_files $uri $uri/ =404;
    }

    # App shell and site pages: always revalidate so updates show up immediately.
    #
    # A regex location beats a prefix one, so this also handles `/app/assets/index-<hash>.js`.
    # That is fine and deliberate: those files exist on disk, so they are served from the same
    # root without needing the fallback above — only the header differs.
    location ~* \.(js|css|json|html|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs, the site's screenshots, icons and fonts never change → cache hard.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
